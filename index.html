<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Will you be my Valentine?</title>

        <!-- Confetti library -->
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg1: #2d1b2e;
                --bg2: #1a0f1c;
                --bg3: #4a2c4d;
                --card: rgba(255, 248, 252, 0.92);
                --card-border: rgba(255, 182, 193, 0.4);
                --yes: #c44569;
                --yesHover: #a83a56;
                --yesGlow: rgba(196, 69, 105, 0.5);
                --text: #3d2a3f;
                --textSoft: #6b4d6e;
                --gold: #d4a574;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(
                        ellipse 120% 80% at 50% 0%,
                        var(--bg3) 0%,
                        transparent 50%
                    ),
                    radial-gradient(
                        circle at 80% 90%,
                        rgba(196, 69, 105, 0.15) 0%,
                        transparent 40%
                    ),
                    radial-gradient(
                        circle at 20% 80%,
                        rgba(212, 165, 116, 0.12) 0%,
                        transparent 35%
                    ),
                    linear-gradient(
                        180deg,
                        var(--bg2) 0%,
                        var(--bg1) 50%,
                        var(--bg2) 100%
                    );
                font-family: "Cormorant Garamond", Georgia, serif;
                overflow: hidden;
                padding: 16px;
            }

            #confettiCanvas {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none;
                z-index: 9999;
            }

            .card {
                position: relative;
                z-index: 1;
                width: min(720px, 92vw);
                padding: 36px 28px;
                background: var(--card);
                -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px);
                border-radius: 24px;
                text-align: center;
                box-shadow:
                    0 0 0 1px var(--card-border),
                    0 25px 80px rgba(45, 27, 46, 0.35),
                    0 0 60px rgba(196, 69, 105, 0.08);
                animation: cardGlow 4s ease-in-out infinite alternate;
            }

            @keyframes cardGlow {
                from {
                    box-shadow:
                        0 0 0 1px var(--card-border),
                        0 25px 80px rgba(45, 27, 46, 0.35),
                        0 0 60px rgba(196, 69, 105, 0.08);
                }
                to {
                    box-shadow:
                        0 0 0 1px var(--card-border),
                        0 25px 80px rgba(45, 27, 46, 0.4),
                        0 0 80px rgba(196, 69, 105, 0.12);
                }
            }

            .art {
                width: min(260px, 80vw);
                margin: 0 auto 10px;
                display: block;
                filter: drop-shadow(0 12px 20px rgba(61, 42, 63, 0.2));
                animation: float 3s ease-in-out infinite;
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-6px);
                }
            }

            h1 {
                font-family: "Great Vibes", cursive;
                font-size: clamp(32px, 5vw, 52px);
                font-weight: 400;
                margin: 16px 0 24px;
                color: var(--text);
                letter-spacing: 0.02em;
                text-shadow: 0 2px 20px rgba(196, 69, 105, 0.15);
            }

            .button-zone {
                position: relative;
                width: min(520px, 92%);
                height: 150px;
                margin: 0 auto;
                touch-action: none;
            }

            button {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                padding: 18px 32px;
                font-size: 20px;
                font-family: "Cormorant Garamond", Georgia, serif;
                font-weight: 600;
                letter-spacing: 0.08em;
                border-radius: 999px;
                border: none;
                cursor: pointer;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                transition:
                    transform 0.12s ease,
                    background 0.2s ease,
                    box-shadow 0.2s ease;
            }

            #yesBtn {
                left: 18%;
                background: var(--yes);
                color: #fff;
                box-shadow:
                    0 8px 24px rgba(196, 69, 105, 0.35),
                    0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            }
            #yesBtn:hover {
                background: var(--yesHover);
                box-shadow:
                    0 12px 32px var(--yesGlow),
                    0 0 0 1px rgba(255, 255, 255, 0.25) inset;
            }

            #noBtn {
                left: 62%;
                background: rgba(212, 165, 116, 0.25);
                color: var(--textSoft);
                border: 1px solid rgba(212, 165, 116, 0.4);
                box-shadow: 0 6px 16px rgba(61, 42, 63, 0.1);
            }
            #noBtn:hover {
                background: rgba(212, 165, 116, 0.35);
            }

            .hint {
                margin-top: 14px;
                font-size: 15px;
                font-style: italic;
                color: var(--textSoft);
                opacity: 0.85;
            }

            .result {
                display: none;
                margin-top: 24px;
                animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .result h2 {
                font-family: "Great Vibes", cursive;
                font-size: clamp(36px, 5vw, 56px);
                font-weight: 400;
                margin: 12px 0 20px;
                color: var(--yes);
                letter-spacing: 0.05em;
            }

            .fireworks {
                width: min(380px, 90vw);
                margin: 0 auto;
                display: block;
                border-radius: 12px;
                box-shadow: 0 12px 40px rgba(196, 69, 105, 0.2);
            }

            @keyframes pop {
                from {
                    transform: scale(0.8);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }
        </style>
    </head>

    <body>
        <canvas id="confettiCanvas"></canvas>

        <main class="card">
            <!-- ANIMAL WITH HEART -->
            <svg
                class="art"
                viewBox="0 0 320 240"
                xmlns="http://www.w3.org/2000/svg"
            >
                <defs>
                    <linearGradient id="fur" x1="0" x2="1">
                        <stop offset="0" stop-color="#f5d5c8" />
                        <stop offset="1" stop-color="#e8b8a8" />
                    </linearGradient>
                    <linearGradient id="heart" x1="0" x2="1">
                        <stop offset="0" stop-color="#e85a7a" />
                        <stop offset="1" stop-color="#c44569" />
                    </linearGradient>
                </defs>

                <path
                    d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
                    fill="url(#heart)"
                />

                <path
                    d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
                    fill="url(#fur)"
                />

                <path d="M110 92 L95 55 L140 78 Z" fill="#e8b8a8" />
                <path d="M270 92 L285 55 L240 78 Z" fill="#e8b8a8" />

                <circle cx="160" cy="130" r="8" />
                <circle cx="220" cy="130" r="8" />

                <path
                    d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
                    fill="#c44569"
                />
            </svg>

            <h1>Pagli will you be my valentine?</h1>

            <section class="button-zone" id="zone">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </section>

            <!-- HINT -->
            <div class="hint" id="hint">“No” seems a bit shy 😈</div>

            <section class="result" id="result">
                <h2>YAY! 🎉</h2>
                <img
                    class="fireworks"
                    src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
                    alt="Fireworks"
                />
            </section>
        </main>

        <script>
            const zone = document.getElementById("zone");
            const yesBtn = document.getElementById("yesBtn");
            const noBtn = document.getElementById("noBtn");
            const result = document.getElementById("result");
            const hint = document.getElementById("hint");

            /* ---------- CONFETTI ---------- */
            const confettiCanvas = document.getElementById("confettiCanvas");

            function resizeConfettiCanvas() {
                const dpr = Math.max(1, window.devicePixelRatio || 1);
                confettiCanvas.width = Math.floor(window.innerWidth * dpr);
                confettiCanvas.height = Math.floor(window.innerHeight * dpr);
                confettiCanvas.style.width = "100vw";
                confettiCanvas.style.height = "100vh";
            }

            resizeConfettiCanvas();
            window.addEventListener("resize", resizeConfettiCanvas);
            window.addEventListener("orientationchange", () =>
                setTimeout(resizeConfettiCanvas, 150),
            );

            const confettiInstance = confetti.create(confettiCanvas, {
                resize: false,
                useWorker: true,
            });

            const romanticColors = [
                "#c44569",
                "#e85a7a",
                "#ffb6c1",
                "#d4a574",
                "#f5d5c8",
                "#e8b8a8",
            ];

            function fullScreenConfetti() {
                const end = Date.now() + 1600;

                (function frame() {
                    confettiInstance({
                        particleCount: 12,
                        spread: 90,
                        startVelocity: 45,
                        ticks: 180,
                        colors: romanticColors,
                        origin: { x: Math.random(), y: Math.random() * 0.3 },
                    });
                    if (Date.now() < end) requestAnimationFrame(frame);
                })();

                setTimeout(() => {
                    confettiInstance({
                        particleCount: 300,
                        spread: 140,
                        startVelocity: 60,
                        ticks: 220,
                        colors: romanticColors,
                        origin: { x: 0.5, y: 0.55 },
                    });
                }, 300);
            }

            /* ---------- YES BUTTON GROWS ---------- */
            let yesScale = 1;
            function growYes() {
                yesScale = Math.min(2.2, yesScale + 0.1);
                yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
            }

            /* ---------- NO BUTTON RUNS AWAY ---------- */
            function clamp(n, min, max) {
                return Math.max(min, Math.min(max, n));
            }

            function moveNo(px, py) {
                const z = zone.getBoundingClientRect();
                const b = noBtn.getBoundingClientRect();

                let dx = b.left + b.width / 2 - px;
                let dy = b.top + b.height / 2 - py;
                let mag = Math.hypot(dx, dy) || 1;
                dx /= mag;
                dy /= mag;

                let newLeft = b.left - z.left + dx * 150;
                let newTop = b.top - z.top + dy * 150;

                newLeft = clamp(newLeft, 0, z.width - b.width);
                newTop = clamp(newTop, 0, z.height - b.height);

                noBtn.style.left = newLeft + "px";
                noBtn.style.top = newTop + "px";
                noBtn.style.transform = "none";

                growYes();
            }

            zone.addEventListener("pointermove", (e) => {
                const b = noBtn.getBoundingClientRect();
                const d = Math.hypot(
                    b.left + b.width / 2 - e.clientX,
                    b.top + b.height / 2 - e.clientY,
                );
                if (d < 140) moveNo(e.clientX, e.clientY);
            });

            noBtn.addEventListener("click", (e) => e.preventDefault());

            /* ---------- YES CLICK ---------- */
            yesBtn.addEventListener("click", () => {
                zone.style.display = "none";
                hint.style.display = "none"; // HIDE THE HINT
                result.style.display = "block";
                resizeConfettiCanvas();
                fullScreenConfetti();
            });
        </script>
    </body>
</html>
